appId: com.gierlowski.sohelper
productName: soHelper
copyright: soHelper

directories:
  output: release
  buildResources: build

# Do paczki idzie wylacznie zbudowany kod. Zrodla, testy i zaleznosci
# deweloperskie zostaja poza nia.
files:
  - out/**/*
  - package.json

# node:sqlite jest wbudowane w Electrona, wiec nie ma tu zadnego modulu
# natywnego do rozpakowywania z asara.
asar: true

mac:
  # Buildy macOS sa tylko lokalne (sprawdzenie spakowanej wersji). Nie trafiaja
  # do wydan, wiec nie powstaje tez latest-mac.yml - aplikacja na macOS
  # nie ma czego szukac i nie szuka.
  publish: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities
  # Bez certyfikatu Apple Developer nie ma czego podpisywac ani notaryzowac.
  identity: null
  notarize: false

win:
  # Sam instalator. Windowsowy .zip byl zbedny - instalator sluzy i ludziom,
  # i electron-updaterowi, a oszczedza ~146 MB uploadu na kazde wydanie.
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Bez kreatora: klikniecie .exe instaluje po cichu i od razu odpala aplikacje.
  # Z perspektywy uzytkownika to "uruchomilem exe", a nie "przeszedlem instalacje".
  # Wybor katalogu jest niedostepny przy oneClick - electron-builder to odrzuca.
  oneClick: true
  # Instalacja per uzytkownik do %LOCALAPPDATA%, wiec bez pytania o admina.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  # Bez slowa "Setup" i bez spacji - to ma wygladac jak plik do uruchomienia,
  # a przy okazji upraszcza adresy pobierania.
  artifactName: ${productName}-${version}.${ext}

linux:
  target: [AppImage]
  category: Utility

# Wydania na GitHubie. Ten wpis wlacza generowanie latest.yml / latest-mac.yml,
# ktore aplikacja odpytuje szukajac nowszej wersji.
publish:
  provider: github
  owner: DamianGierlowski
  repo: SoHelper
